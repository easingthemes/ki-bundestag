name: Database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Database action"
        required: true
        type: choice
        options:
          - migrate
          - backup
          - query-state
          - query-recent-events

jobs:
  run:
    name: "DB: ${{ inputs.action }}"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute database action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/ki-bundestag
            ACTION="${{ inputs.action }}"

            case "$ACTION" in
              migrate)
                echo "==> Running migrations..."
                npm run migrate
                echo "==> Done."
                ;;
              backup)
                BACKUP_DIR="/opt/backups/ki-bundestag/manual-$(date +%Y%m%d-%H%M%S)"
                mkdir -p "$BACKUP_DIR"
                echo "==> Backing up to $BACKUP_DIR..."
                sqlite3 data/simulation.db ".backup '$BACKUP_DIR/simulation.db'"
                sqlite3 data/users.db ".backup '$BACKUP_DIR/users.db'" 2>/dev/null || echo "users.db not found, skipped"
                ls -lh "$BACKUP_DIR/"
                echo "==> Backup complete."
                ;;
              query-state)
                echo "==> Simulation meta:"
                sqlite3 -header -column data/simulation.db "SELECT * FROM simulation_meta LIMIT 1"
                echo ""
                echo "==> Parties:"
                sqlite3 -header -column data/simulation.db "SELECT short_name, approval_rating, seats, is_in_government FROM parties ORDER BY seats DESC"
                echo ""
                echo "==> Total events:"
                sqlite3 data/simulation.db "SELECT COUNT(*) || ' events total' FROM simulation_events"
                ;;
              query-recent-events)
                echo "==> Last 30 simulation events:"
                sqlite3 -header -column data/simulation.db "SELECT day_number, type, actor, title FROM simulation_events ORDER BY id DESC LIMIT 30"
                ;;
            esac
