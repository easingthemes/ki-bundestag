name: Database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Database action"
        required: true
        type: choice
        options:
          - migrate
          - backup
          - list-backups
          - query-state
          - query-recent-events
          - query-content-counts

jobs:
  run:
    name: "DB: ${{ inputs.action }}"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute database action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/ki-bundestag
            ACTION="${{ inputs.action }}"

            case "$ACTION" in
              migrate)
                echo "==> Running migrations..."
                npm run migrate
                echo "==> Done."
                ;;
              backup)
                BACKUP_DIR="/opt/backups/ki-bundestag/manual-$(date +%Y%m%d-%H%M%S)"
                mkdir -p "$BACKUP_DIR"
                echo "==> Backing up to $BACKUP_DIR..."
                sqlite3 data/simulation.db ".backup '$BACKUP_DIR/simulation.db'"
                sqlite3 data/users.db ".backup '$BACKUP_DIR/users.db'" 2>/dev/null || echo "users.db not found, skipped"
                ls -lh "$BACKUP_DIR/"
                echo "==> Backup complete."
                ;;
              list-backups)
                echo "==> Seed backups (data/*.backup*):"
                ls -lht data/*.backup* 2>/dev/null | head -20 || echo "  None found"
                echo ""
                echo "==> Pre-deploy backups:"
                ls -lht /opt/backups/ki-bundestag/pre-deploy/ 2>/dev/null || echo "  None found"
                echo ""
                echo "==> Manual backups:"
                ls -lhtR /opt/backups/ki-bundestag/manual-* 2>/dev/null | head -30 || echo "  None found"
                echo ""
                echo "==> Total backup disk usage:"
                du -sh /opt/backups/ki-bundestag/ 2>/dev/null || echo "  No backup dir"
                du -sh data/*.backup* 2>/dev/null || echo "  No seed backups"
                ;;
              query-state)
                echo "==> Simulation meta:"
                sqlite3 -header -column data/simulation.db "SELECT * FROM simulation_meta LIMIT 1"
                echo ""
                echo "==> Parties:"
                sqlite3 -header -column data/simulation.db "SELECT short_name, approval_rating, seats, is_in_government FROM parties ORDER BY seats DESC"
                echo ""
                echo "==> Total events:"
                sqlite3 data/simulation.db "SELECT COUNT(*) || ' events total' FROM simulation_events"
                ;;
              query-recent-events)
                echo "==> Last 30 simulation events:"
                sqlite3 -header -column data/simulation.db "SELECT day_number, type, actor, title FROM simulation_events ORDER BY id DESC LIMIT 30"
                ;;
              query-content-counts)
                echo "==> Content totals:"
                echo "  Media articles: $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM media_articles')"
                echo "  Polls:          $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM polls')"
                echo "  Bills:          $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM bills')"
                echo "  Elections:      $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM elections')"
                echo "  Crises:         $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM crises')"
                echo "  Motions:        $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM motions')"
                echo "  Questions:      $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM citizen_questions')"
                echo "  Referendums:    $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM referendums')"
                echo "  Events:         $(sqlite3 data/simulation.db 'SELECT COUNT(*) FROM simulation_events')"
                echo ""
                echo "==> Events by type (all time):"
                sqlite3 -header -column data/simulation.db "SELECT type, COUNT(*) as count, MIN(day_number) as first_day, MAX(day_number) as last_day FROM simulation_events GROUP BY type ORDER BY count DESC"
                echo ""
                echo "==> Media articles per day (last 30 with articles):"
                sqlite3 -header -column data/simulation.db "SELECT day_number, COUNT(*) as articles FROM media_articles GROUP BY day_number ORDER BY day_number DESC LIMIT 30"
                echo ""
                echo "==> Bills per status:"
                sqlite3 -header -column data/simulation.db "SELECT status, COUNT(*) as count FROM bills GROUP BY status ORDER BY count DESC"
                echo ""
                echo "==> Days with zero events:"
                sqlite3 data/simulation.db "SELECT (SELECT current_day FROM simulation_meta) - COUNT(DISTINCT day_number) as days_without_events FROM simulation_events"
                ;;
            esac
