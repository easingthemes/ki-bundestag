name: Server Status

on:
  workflow_dispatch:
    inputs:
      check:
        description: "What to check"
        required: true
        type: choice
        options:
          - pm2-status
          - api-logs
          - simulate-logs
          - simulate-errors
          - cost-report
          - disk-usage
          - db-stats
          - db-deep-debug
          - full-health
      lines:
        description: "Log lines to retrieve (default 80, max 5000)"
        required: false
        type: string
        default: "80"

jobs:
  run:
    name: "Status: ${{ inputs.check }}"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check server status
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/ki-bundestag
            CHECK="${{ inputs.check }}"
            LINES="${{ inputs.lines }}"
            # Clamp lines to 1-5000
            LINES=$((LINES > 5000 ? 5000 : LINES < 1 ? 80 : LINES))

            case "$CHECK" in
              pm2-status)
                pm2 status
                ;;
              api-logs)
                echo "==> Last $LINES lines of ki-api logs:"
                pm2 logs ki-api --lines $LINES --nostream
                ;;
              simulate-logs)
                echo "==> Last $LINES lines of ki-simulate stdout:"
                pm2 logs ki-simulate --lines $LINES --nostream --out 2>/dev/null || echo "ki-simulate not running"
                ;;
              simulate-errors)
                echo "==> Last $LINES lines of ki-simulate stderr:"
                pm2 logs ki-simulate --lines $LINES --nostream --err 2>/dev/null || echo "ki-simulate not running"
                ;;
              cost-report)
                echo "==> Simulation state:"
                sqlite3 -header -column data/simulation.db "SELECT current_day, timing_preset, context_depth, last_run_at FROM simulation_meta LIMIT 1"
                echo ""
                echo "==> Per-day AI cost (last 30 days with data):"
                sqlite3 -header -column data/simulation.db "
                  SELECT day_number,
                    COUNT(*) as calls,
                    SUM(input_tokens) as input_tok,
                    SUM(output_tokens) as output_tok,
                    ROUND(SUM(cost_usd), 4) as cost_usd,
                    SUM(CASE WHEN success = 0 THEN 1 ELSE 0 END) as failed
                  FROM ai_calls
                  GROUP BY day_number
                  ORDER BY day_number DESC
                  LIMIT 30
                "
                echo ""
                echo "==> Cost by task (all time):"
                sqlite3 -header -column data/simulation.db "
                  SELECT task,
                    COUNT(*) as calls,
                    SUM(input_tokens) as input_tok,
                    SUM(output_tokens) as output_tok,
                    ROUND(SUM(cost_usd), 4) as cost_usd,
                    ROUND(AVG(latency_ms)) as avg_lat_ms
                  FROM ai_calls
                  GROUP BY task
                  ORDER BY cost_usd DESC
                "
                echo ""
                echo "==> Cost by model (all time):"
                sqlite3 -header -column data/simulation.db "
                  SELECT provider, model,
                    COUNT(*) as calls,
                    SUM(input_tokens) as input_tok,
                    SUM(output_tokens) as output_tok,
                    ROUND(SUM(cost_usd), 4) as cost_usd
                  FROM ai_calls
                  GROUP BY provider, model
                "
                echo ""
                echo "==> Totals:"
                sqlite3 -header -column data/simulation.db "
                  SELECT
                    COUNT(*) as total_calls,
                    SUM(input_tokens) as total_input,
                    SUM(output_tokens) as total_output,
                    ROUND(SUM(cost_usd), 4) as total_cost_usd,
                    ROUND(SUM(cost_usd) * 1.0 / COUNT(DISTINCT day_number), 4) as avg_cost_per_day,
                    COUNT(DISTINCT day_number) as days_with_data,
                    SUM(CASE WHEN success = 0 THEN 1 ELSE 0 END) as failed_calls
                  FROM ai_calls
                "
                echo ""
                echo "==> Batch timing (last 20 batches):"
                sqlite3 -header -column data/simulation.db "
                  SELECT batch_id,
                    COUNT(*) as reqs,
                    MIN(created_at) as started,
                    ROUND(SUM(cost_usd), 4) as cost
                  FROM ai_calls
                  WHERE batch_id IS NOT NULL
                  GROUP BY batch_id
                  ORDER BY started DESC
                  LIMIT 20
                "
                ;;
              disk-usage)
                echo "==> Disk usage:"
                df -h /
                echo ""
                echo "==> Database sizes:"
                ls -lh data/*.db 2>/dev/null || echo "No databases found"
                echo ""
                echo "==> Backup sizes:"
                du -sh /opt/backups/ki-bundestag/ 2>/dev/null || echo "No backups found"
                ;;
              db-stats)
                echo "==> Simulation state:"
                sqlite3 -header -column data/simulation.db "SELECT * FROM simulation_meta LIMIT 1"
                echo ""
                echo "==> Event counts by type (last 7 days):"
                sqlite3 -header -column data/simulation.db "SELECT type, COUNT(*) as count FROM simulation_events WHERE day_number > (SELECT current_day FROM simulation_meta) - 7 GROUP BY type ORDER BY count DESC"
                echo ""
                echo "==> Bills summary:"
                sqlite3 -header -column data/simulation.db "SELECT status, COUNT(*) as count FROM bills GROUP BY status ORDER BY count DESC"
                echo ""
                echo "==> Party approvals:"
                sqlite3 -header -column data/simulation.db "SELECT short_name, approval_rating FROM parties ORDER BY approval_rating DESC"
                ;;
              db-deep-debug)
                echo "==> Simulation state:"
                sqlite3 -header -column data/simulation.db "SELECT * FROM simulation_meta LIMIT 1"
                echo ""
                echo "==> Table row counts:"
                for tbl in simulation_events bills media_articles polls elections crises parties motions confidence_votes constitutional_challenges referendums citizen_questions budgets party_history bundestag_seats fraktionen government national_state; do
                  cnt=$(sqlite3 data/simulation.db "SELECT COUNT(*) FROM $tbl" 2>/dev/null || echo "N/A")
                  printf "  %-30s %s\n" "$tbl" "$cnt"
                done
                echo ""
                echo "==> Event counts by type (ALL time):"
                sqlite3 -header -column data/simulation.db "SELECT type, COUNT(*) as count, MIN(day_number) as first_day, MAX(day_number) as last_day FROM simulation_events GROUP BY type ORDER BY count DESC"
                echo ""
                echo "==> Media articles by day (last 30 days with articles):"
                sqlite3 -header -column data/simulation.db "SELECT day_number, COUNT(*) as articles FROM media_articles GROUP BY day_number ORDER BY day_number DESC LIMIT 30"
                echo ""
                echo "==> Elections history:"
                sqlite3 -header -column data/simulation.db "SELECT id, election_day, status, trigger_reason FROM elections ORDER BY election_day DESC LIMIT 10"
                echo ""
                echo "==> Active crises:"
                sqlite3 -header -column data/simulation.db "SELECT name, severity, start_day, end_day FROM crises WHERE end_day IS NULL OR end_day >= (SELECT current_day FROM simulation_meta)"
                echo ""
                echo "==> Day range with data:"
                sqlite3 -header -column data/simulation.db "SELECT MIN(day_number) as earliest_event, MAX(day_number) as latest_event, COUNT(DISTINCT day_number) as days_with_events FROM simulation_events"
                echo ""
                echo "==> Last 10 non-negotiation events:"
                sqlite3 -header -column data/simulation.db "SELECT day_number, type, actor, substr(title, 1, 60) as title FROM simulation_events WHERE type != 'negotiation_round' ORDER BY id DESC LIMIT 10"
                echo ""
                echo "==> Coalition / government state:"
                sqlite3 -header -column data/simulation.db "SELECT * FROM government ORDER BY formed_on_day DESC LIMIT 3"
                echo ""
                echo "==> Negotiation status (active elections):"
                sqlite3 -header -column data/simulation.db "SELECT id, election_day, status, json_array_length(negotiation_rounds) as rounds FROM elections WHERE status IN ('announced','campaigning','voting','negotiation') LIMIT 5"
                echo ""
                echo "==> DB file info:"
                ls -lh data/*.db data/*.db-wal data/*.db-shm 2>/dev/null || true
                echo ""
                echo "==> Backup files on server:"
                ls -lht data/*.backup* 2>/dev/null | head -10 || echo "No seed backups in data/"
                ls -lht /opt/backups/ki-bundestag/ 2>/dev/null || echo "No backups in /opt/backups/"
                ;;
              full-health)
                echo "=== PM2 Processes ==="
                pm2 status
                echo ""
                echo "=== Disk ==="
                df -h /
                echo ""
                echo "=== Memory ==="
                free -h
                echo ""
                echo "=== DB Sizes ==="
                ls -lh data/*.db 2>/dev/null || echo "No databases"
                echo ""
                echo "=== Simulation State ==="
                sqlite3 -header -column data/simulation.db "SELECT * FROM simulation_meta LIMIT 1"
                echo ""
                echo "=== API Health ==="
                curl -sf http://localhost:3001/api/state | head -c 200 || echo "API not responding"
                echo ""
                echo "=== Uptime ==="
                uptime
                ;;
            esac
