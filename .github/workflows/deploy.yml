name: Deploy

on:
  # Auto-deploy when semantic-release creates a GitHub Release
  release:
    types: [published]

  # Manual trigger for rollbacks — specify a git tag like v1.2.3
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag like v1.2.3, SHA, or branch)'
        required: false
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name || 'main' }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and build web frontend
        run: |
          npm ci
          npx turbo run build --filter=@ki-bundestag/web

      # Rsync source + pre-built web/dist to server.
      # API + engine run from source via tsx — no dist/ needed for them.
      # Server only runs npm ci (for native deps like better-sqlite3).
      - name: Deploy via ssh-deploy
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          SOURCE: ""
          TARGET: /opt/ki-bundestag/
          ARGS: -rlgoDzvc -i --delete
          EXCLUDE: >-
            .git,
            .github,
            .claude,
            .env,
            node_modules,
            data/*.db,
            data/*.db-wal,
            data/*.db-shm
          SCRIPT_BEFORE: |
            test -f /opt/ki-bundestag/scripts/backup.sh && bash /opt/ki-bundestag/scripts/backup.sh || echo "backup.sh not found, skipping"
          SCRIPT_BEFORE_REQUIRED: "false"
          SCRIPT_AFTER: |
            bash /opt/ki-bundestag/scripts/post-deploy.sh
          SCRIPT_AFTER_REQUIRED: "true"
