name: Model Settings

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        default: "view"
        options:
          - view
          - set-default-parties
          - set-all-parties
          - set-party
          - set-role
          - set-cost-mode
      model:
        description: "[set-default-parties / set-all-parties / set-party / set-role] Model to use"
        required: false
        type: choice
        default: "(no change)"
        options:
          - "(no change)"
          - "anthropic:claude-haiku-4-5-20251001"
          - "anthropic:claude-haiku-3-5-20241022"
          - "anthropic:claude-sonnet-4-5-20250929"
          - "anthropic:claude-sonnet-4-6-20250514"
          - "xai:grok-3-mini"
      party:
        description: "[set-party] Which party"
        required: false
        type: choice
        default: "(all)"
        options:
          - "(all)"
          - spd
          - cdu
          - gruene
          - fdp
          - afd
          - linke
      role:
        description: "[set-role] Which role"
        required: false
        type: choice
        default: daily
        options:
          - daily
          - negotiation
          - synthesis
      cost_mode:
        description: "[set-cost-mode] Preset"
        required: false
        type: choice
        default: balanced
        options:
          - cheapest
          - balanced
          - quality
      restart_sim:
        description: "Restart ki-simulate after change"
        required: false
        type: boolean
        default: true

jobs:
  run:
    name: "Models: ${{ inputs.action }}"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate inputs
        run: |
          ACTION="${{ inputs.action }}"
          MODEL="${{ inputs.model }}"
          if [[ "$ACTION" == "set-default-parties" || "$ACTION" == "set-all-parties" || "$ACTION" == "set-party" || "$ACTION" == "set-role" ]]; then
            if [[ "$MODEL" == "(no change)" ]]; then
              echo "::error::Select a model when using $ACTION"
              exit 1
            fi
          fi

      - name: Execute model settings
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/ki-bundestag
            ACTION="${{ inputs.action }}"
            MODEL="${{ inputs.model }}"
            PARTY="${{ inputs.party }}"
            ROLE="${{ inputs.role }}"
            COST_MODE="${{ inputs.cost_mode }}"
            RESTART="${{ inputs.restart_sim }}"

            # Helper: update or add env var
            set_env() {
              local KEY="$1" VALUE="$2"
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
                echo "  Updated: ${KEY}=${VALUE}"
              else
                echo "${KEY}=${VALUE}" >> .env
                echo "  Added: ${KEY}=${VALUE}"
              fi
            }

            # Helper: remove env var (revert to default)
            unset_env() {
              local KEY="$1"
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                sed -i "/^${KEY}=/d" .env
                echo "  Removed: ${KEY} (reverted to default)"
              fi
            }

            # Helper: show current config
            show_config() {
              echo "=== Current Model Configuration ==="
              echo ""
              echo "--- Party Models (env overrides) ---"
              for P in SPD CDU GRUENE FDP AFD LINKE; do
                VAL=$(grep "^MODEL_PARTY_${P}=" .env 2>/dev/null | cut -d= -f2-)
                if [ -n "$VAL" ]; then
                  echo "  ${P}: ${VAL} (override)"
                else
                  case "$P" in
                    AFD) echo "  ${P}: xai:grok-3-mini (default)" ;;
                    *)   echo "  ${P}: anthropic:claude-haiku-4-5-20251001 (default)" ;;
                  esac
                fi
              done
              echo ""
              echo "--- Role Models (env overrides) ---"
              for R in DAILY NEGOTIATION SYNTHESIS; do
                VAL=$(grep "^MODEL_${R}=" .env 2>/dev/null | cut -d= -f2-)
                if [ -n "$VAL" ]; then
                  echo "  ${R}: ${VAL} (override)"
                else
                  case "$R" in
                    SYNTHESIS) echo "  ${R}: anthropic:claude-sonnet-4-5-20250929 (default)" ;;
                    *)         echo "  ${R}: anthropic:claude-haiku-4-5-20251001 (default)" ;;
                  esac
                fi
              done
              echo ""
              echo "--- Cost Reference ---"
              echo "  Haiku 4.5:  \$0.50/\$2.50 per MTok (batch)"
              echo "  Haiku 3.5:  \$0.40/\$2.00 per MTok (batch)"
              echo "  Sonnet 4.5: \$1.50/\$7.50 per MTok (batch)"
              echo "  Sonnet 4.6: \$1.50/\$7.50 per MTok (batch)"
              echo "  Grok mini:  xAI pricing (no batch discount)"
            }

            case "$ACTION" in
              view)
                show_config
                ;;

              set-default-parties)
                echo "==> Setting default parties (all except AfD) to: ${MODEL}"
                for P in SPD CDU GRUENE FDP LINKE; do
                  set_env "MODEL_PARTY_${P}" "${MODEL}"
                done
                echo "  AfD: unchanged (uses separate model)"
                echo ""
                show_config
                ;;

              set-all-parties)
                echo "==> Setting ALL party models (including AfD) to: ${MODEL}"
                for P in SPD CDU GRUENE FDP AFD LINKE; do
                  set_env "MODEL_PARTY_${P}" "${MODEL}"
                done
                echo ""
                show_config
                ;;

              set-party)
                if [ "$PARTY" = "(all)" ]; then
                  echo "==> Setting ALL party models to: ${MODEL}"
                  for P in SPD CDU GRUENE FDP AFD LINKE; do
                    set_env "MODEL_PARTY_${P}" "${MODEL}"
                  done
                else
                  PARTY_UPPER=$(echo "$PARTY" | tr '[:lower:]' '[:upper:]')
                  echo "==> Setting ${PARTY_UPPER} model to: ${MODEL}"
                  set_env "MODEL_PARTY_${PARTY_UPPER}" "${MODEL}"
                fi
                echo ""
                show_config
                ;;

              set-role)
                ROLE_UPPER=$(echo "$ROLE" | tr '[:lower:]' '[:upper:]')
                echo "==> Setting ${ROLE_UPPER} role model to: ${MODEL}"
                set_env "MODEL_${ROLE_UPPER}" "${MODEL}"
                echo ""
                show_config
                ;;

              set-cost-mode)
                echo "==> Applying cost mode: ${COST_MODE}"
                echo ""
                case "$COST_MODE" in
                  cheapest)
                    echo "  Mode: CHEAPEST — Haiku 3.5 everywhere, Haiku 4.5 for synthesis"
                    echo "  Est. ~\$0.015/day (batch)"
                    echo ""
                    for P in SPD CDU GRUENE FDP AFD LINKE; do
                      set_env "MODEL_PARTY_${P}" "anthropic:claude-haiku-3-5-20241022"
                    done
                    set_env "MODEL_DAILY" "anthropic:claude-haiku-3-5-20241022"
                    set_env "MODEL_NEGOTIATION" "anthropic:claude-haiku-3-5-20241022"
                    set_env "MODEL_SYNTHESIS" "anthropic:claude-haiku-4-5-20251001"
                    ;;
                  balanced)
                    echo "  Mode: BALANCED — Haiku 4.5 for parties, Haiku 4.5 for synthesis"
                    echo "  Est. ~\$0.025/day (batch)"
                    echo ""
                    # Remove party overrides (use defaults: Haiku 4.5 + Grok for AfD)
                    for P in SPD CDU GRUENE FDP LINKE; do
                      unset_env "MODEL_PARTY_${P}"
                    done
                    unset_env "MODEL_PARTY_AFD"
                    set_env "MODEL_PARTY_AFD" "xai:grok-3-mini"
                    unset_env "MODEL_DAILY"
                    unset_env "MODEL_NEGOTIATION"
                    set_env "MODEL_SYNTHESIS" "anthropic:claude-haiku-4-5-20251001"
                    ;;
                  quality)
                    echo "  Mode: QUALITY — Haiku 4.5 for parties, Sonnet for synthesis"
                    echo "  Est. ~\$0.035/day (batch)"
                    echo ""
                    # Remove party overrides (use defaults)
                    for P in SPD CDU GRUENE FDP LINKE; do
                      unset_env "MODEL_PARTY_${P}"
                    done
                    unset_env "MODEL_PARTY_AFD"
                    set_env "MODEL_PARTY_AFD" "xai:grok-3-mini"
                    unset_env "MODEL_DAILY"
                    unset_env "MODEL_NEGOTIATION"
                    unset_env "MODEL_SYNTHESIS"
                    ;;
                esac
                echo ""
                show_config
                ;;
            esac

            # Restart simulation if requested
            if [ "$RESTART" = "true" ] && [ "$ACTION" != "view" ]; then
              echo ""
              echo "==> Restarting ki-simulate..."
              pm2 restart ki-simulate --update-env 2>/dev/null || echo "ki-simulate not running (start via Simulation workflow)"
              echo ""
              pm2 status
            fi
