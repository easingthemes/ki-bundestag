name: Server Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "npm script or pm2 command"
        required: true
        type: choice
        options:
          - npm run migrate
          - npm run simulate
          - npm run simulate:auto
          - pm2 start npx --name ki-api -- tsx packages/api/src/index.ts
          - pm2 restart ki-api --update-env
          - pm2 logs ki-api --lines 50 --nostream
          - pm2 status

jobs:
  run:
    name: Run on Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute command
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/ki-bundestag
            ${{ inputs.command }}
