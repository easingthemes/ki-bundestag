name: Custom Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command to run on server (use other workflows for common tasks)"
        required: true
        type: string

jobs:
  run:
    name: Run on Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute command
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            cd /opt/ki-bundestag
            ${{ inputs.command }}
