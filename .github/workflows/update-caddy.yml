name: Update Caddy Config

on:
  workflow_dispatch:
    inputs:
      setup_sudoers:
        description: "First-time setup: add sudoers rule for Caddy (requires root SSH key)"
        type: boolean
        default: false

jobs:
  update:
    name: Update Caddy Config
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # One-time setup: grant deploy user passwordless sudo for Caddy operations
      - name: Setup sudoers (first-time only)
        if: inputs.setup_sudoers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            echo '${{ secrets.DEPLOY_USER }} ALL=(ALL) NOPASSWD: /usr/bin/tee /etc/caddy/Caddyfile, /usr/bin/systemctl reload caddy, /usr/bin/systemctl restart caddy, /usr/bin/systemctl start caddy' > /etc/sudoers.d/caddy-deploy
            chmod 440 /etc/sudoers.d/caddy-deploy
            echo "Sudoers rule created for ${{ secrets.DEPLOY_USER }}"

      # Copy Caddyfile from repo and reload
      - name: Deploy Caddy config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 5m
          script: |
            cd /opt/ki-bundestag
            sudo tee /etc/caddy/Caddyfile < packages/web/Caddyfile > /dev/null
            sudo systemctl restart caddy
            echo "Caddy config updated and restarted"
            caddy version
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost/
